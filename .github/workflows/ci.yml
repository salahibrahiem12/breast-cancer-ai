name: BreastCare AI CI/CD & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend API Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Backend Multimodal API Tests
        env:
          BREASTCARE_CLASSIFICATION_ENABLED: "false"
        run: |
          python -m pytest tests/test_multimodal_api.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Production Next.js Build
        run: npm run build
